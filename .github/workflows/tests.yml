# Unit-Tests und statische Analyse bei jedem Push und Pull Request, dazu eine unsignierte
# Release-APK für den Abgleich auf Bitgleichheit.
# `connectedAndroidTest` läuft hier bewusst nicht: Es braucht einen Emulator und bleibt
# Punkt 3 der Test-Pflicht in CLAUDE.md. Signiert wird nie in der CI (docs/agents/release.md).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Startet nur den Gradle-Client. Den Daemon (JetBrains JDK 21) lädt Gradle selbst,
      # siehe gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: gradlew test detekt
        run: ./gradlew test detekt --continue

      # Unsignierte Release-APK aus einem Linux-Build, wie F-Droid ihn macht. Vor jedem Tag wird
      # sie mit der lokal signierten APK verglichen (docs/agents/release.md). Ohne
      # keystore.properties bleibt sie unsigniert, der Schlüssel kommt nie in die CI.
      - name: gradlew assembleRelease
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error
